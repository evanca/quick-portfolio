name: Build and Preview

# Every PR gets a preview at pr-<n>.thomasjbarlow.com: type-check the site,
# build the image tagged with the PR number, deploy the preview stack. The
# preview never serves the CMS (ADMIN_ENABLED=false in stack.pr.yml).

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.event.number }}
  cancel-in-progress: true

# Nothing here writes to the repository; the deploy talks to Docker through
# the self-hosted runner's socket, not through the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  site_check:
    name: Site Type-Check
    runs-on:
      - self-hosted
      - docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install and check
        working-directory: site
        run: |
          npm ci
          npm run check

  build_site_image:
    name: Build and Push Site Image
    needs: site_check
    runs-on:
      - self-hosted
      - docker
    steps:
      - name: Clean up
        uses: AutoModality/action-clean@v1
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Task
        uses: arduino/setup-task@v2
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.thomasjbarlow.com
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and Push Site Image
        run: task build:site:tag -- ${{ github.event.number }}

  deploy_pr_preview:
    name: Deploy PR Preview Stack
    needs: build_site_image
    if: ${{ github.event_name == 'pull_request' }}
    runs-on:
      - self-hosted
      - docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Task
        uses: arduino/setup-task@v2
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: registry.thomasjbarlow.com
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Deploy PR Stack
        run: task deploy:pr -- ${{ github.event.number }}
      - name: Preview URL
        run: |
          {
            echo "## Preview"
            echo
            echo "https://pr-${{ github.event.number }}.thomasjbarlow.com"
          } >> "$GITHUB_STEP_SUMMARY"
